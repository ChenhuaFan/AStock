[project]
name = "limitup-signal-bot"
version = "0.1.0"
description = "Daily A-share limit-up signal bot using LightGBM models."
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.18.0",
  "lightgbm>=4.6.0",
  "numpy>=2.0.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "requests>=2.32.0",
  "scikit-learn>=1.6.0",
]

[project.scripts]
limitup-signal = "limitup_signal_bot.run_daily:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
